<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">WT</div>
            <h1>WinTech Hub</h1>
            <p class="subtitle">Join Us today and get started</p>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="account.html">Account</a></li>
            </ul>
        </nav>
    </header>
    <section class="contact">
        <div class="contacts">
        <h1>Get in Touch</h1>
        <p>We'd love to hear from you! Contact Us via:</p>
        <div class="contact-links">
            <p>Email: <a href="wintechsolutions@gmail.com">Email Us</a></p>
            <p>Phone:<a href="tel:+254714704987">Call Us</a></p>
            <p>WhatsApp: <a href="https://wa.me/0714704987">Chat With Us</a></p>
        </div>
        <h2>OR</h2>
        <p>Send us a Messsage</p>
        <form action="" method="post" class="form">
            <div class="input-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" placeholder="Enter First Name">
            </div>
            <div class="input-group">
                <label for="sname">Second Name</label>
                <input type="text" id="sname" name="sname" placeholder="Enter Second Name">
            </div>
            <div class="input-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" placeholder="Enter Second Name">
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter Email">
            </div>
            <div class="input-group">
                <label for="message">Message</label>
                <textarea name="message" id="message"></textarea>
            </div>
            <button type="submit">Send Message</button>
        </form>
        </div>
    </section>
</body>
</html>
