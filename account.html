<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">WT</div>
            <h1>WinTech Hub</h1>
            <p class="subtitle">Join Us today and get started</p>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="account.html">Account</a></li>
            </ul>
        </nav>
    </header>
<section class="account">
    <div class="accounts">
        <form action="" method="post" class="form">
            <div class="input-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" placeholder="Enter First Name">
            </div>
            <div class="input-group">
                <label for="sname">Second Name</label>
                <input type="text" id="sname" name="sname" placeholder="Enter Second Name">
            </div>
            <div class="input-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" placeholder="Enter Second Name">
            </div>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter Email">
            </div>
            <div class="input-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" name="dob">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter Password">
            </div>
            <div class="input-group">
                <label for="confpass">Confirm Password</label>
                <input type="password" id="confpass" name="confpass" placeholder="Confirm Password">
            </div>
            <div class="gender-options">
                <label for="gender">Gender:</label>
                <label for="male">Male</label>
                <input type="radio" id="male" name="content">
                <label for="female">Female</label>
                <input type="radio" id="female" name="content">
            </div>
            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the Terms and Conditions.</label>
            </div>
            <button type="submit">Create Account</button>
        </form>
        <p class="login">Already have an Account?<a href="">Login</a></p>
    </div>
    </section>
</body>
</html>
